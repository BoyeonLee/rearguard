  </head><body class="bg-surface text-on-surface antialiased select-none"><main class="min-h-screen w-full flex flex-col justify-between bg-surface pt-safe pb-safe"><div class="flex flex-col w-full justify-between px-margin py-space-xl flex-grow select-none">

<div></div>
<div class="flex items-center gap-space-xs">

</div>
<!-- Center Core Telemetry Cluster -->

<!-- Active Status Pulse -->

        00:42:17
      </div>

<span class="font-label-md text-label-md uppercase tracking-widest text-on-surface-variant/70">경과 시간</span>

</div>
<!-- Diagnostic Sensor Chips -->
<div class="grid grid-cols-3 gap-2 w-full max-w-[320px] mt-space-xl">
<!-- Camera Chip -->
<div class="flex flex-col items-center justify-center py-2.5 px-2 rounded-lg bg-surface-container-low transition-colors">

<span class="font-label-sm text-label-sm text-on-surface-variant mt-1">카메라</span>

</div>
<!-- Handlebar Unit Chip -->
<div class="flex flex-col items-center justify-center py-2.5 px-2 rounded-lg bg-surface-container-low transition-colors">
<div class="flex items-center gap-1.5">

</div>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-1">핸들 유닛</span>
<span class="font-label-sm text-[9px] text-tertiary/75 tracking-tighter mt-0.5 font-semibold">OK</span>
</div>
<!-- Rear LED Strobe Chip -->
<div class="flex flex-col items-center justify-center py-2.5 px-2 rounded-lg bg-surface-container-low transition-colors">
<div class="flex items-center gap-1.5">

</div>

</div>

</div>
<!-- OLED Screen Off & Guidance Notice -->
<div class="w-full flex flex-col items-center mb-space-lg text-center px-space-md">
<div class="flex items-center gap-1.5 text-on-surface-variant/60 mb-1">

<span class="font-label-sm text-label-sm tracking-wider uppercase">OLED 배터리 세이버</span>

<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] leading-relaxed">
      화면은 곧 꺼져요. 위험 경고는 핸들 유닛의 불빛과 경고음으로 전달돼요.

<!-- Bottom Long-Press Safety Action Button -->
<div class="w-full pb-safe">
<div class="relative w-full h-[62px] bg-surface-container-low active:bg-surface-container rounded-lg overflow-hidden flex items-center justify-between px-space-md cursor-pointer select-none touch-none transition-all" id="stopRideBtn">
<!-- Background Fill on Long Press -->

<!-- Left Lock & Instructions Guide -->

<span class="material-symbols-outlined text-[18px]">stop_circle</span>
</div>

</div>

<!-- SVG Circular Progress Bar -->
<div class="relative z-10 w-9 h-9 flex items-center justify-center">
<svg class="w-9 h-9 transform -rotate-90" viewbox="0 0 36 36">
<path class="text-surface-container-highest" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="3"></path>
<path class="text-primary-container transition-all" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" id="circularProgressStroke" stroke="currentColor" stroke-dasharray="0, 100" stroke-linecap="square" stroke-width="3"></path>
</svg>
<span class="material-symbols-outlined absolute text-[14px] text-on-surface-variant" id="btnIcon">lock</span>
</div>
</div>
</div>
</div>
<script>
  (function() {
    // 1. Elapsed Time Ticker (Base start: 00:42:17 = 2537s)
    let totalSeconds = 2537;
    const timerEl = document.getElementById('rideTimer');

    function pad(v) {
      return v.toString().padStart(2, '0');
    }

    setInterval(() => {
      totalSeconds++;
      const hrs = Math.floor(totalSeconds / 3600);
      const mins = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;
      if (timerEl) {
        timerEl.textContent = `${pad(hrs)}:${pad(mins)}:${pad(secs)}`;
      }
    }, 1000);

    // 2. Long Press Logic with Progress Animation
    const btn = document.getElementById('stopRideBtn');
    const progressBg = document.getElementById('pressProgressBg');
    const circleStroke = document.getElementById('circularProgressStroke');
    const hintText = document.getElementById('pressHintText');
    const btnIcon = document.getElementById('btnIcon');

    let pressStartTime = 0;
    let pressTimer = null;
    let animFrame = null;
    const REQUIRED_PRESS_DURATION = 3000; // 3 seconds

    function resetPress() {
      cancelAnimationFrame(animFrame);
      clearTimeout(pressTimer);
      pressTimer = null;
      if (progressBg) progressBg.style.width = '0%';
      if (circleStroke) circleStroke.setAttribute('stroke-dasharray', '0, 100');
      if (hintText) hintText.textContent = '3초간 길게 누르기';
      if (btnIcon) {
        btnIcon.textContent = 'lock';
        btnIcon.classList.remove('text-primary');
      }
    }

    function updateProgress() {
      const elapsed = Date.now() - pressStartTime;
      const progressRatio = Math.min(elapsed / REQUIRED_PRESS_DURATION, 1.0);
      const percentage = (progressRatio * 100).toFixed(1);

      if (progressBg) progressBg.style.width = percentage + '%';
      if (circleStroke) circleStroke.setAttribute('stroke-dasharray', `${percentage}, 100`);

      const remainingSecs = Math.max(0, ((REQUIRED_PRESS_DURATION - elapsed) / 1000)).toFixed(1);
      if (hintText) hintText.textContent = `${remainingSecs}초 유지...`;

      if (progressRatio < 1.0) {
        animFrame = requestAnimationFrame(updateProgress);
      } else {
        onCompletedPress();
      }
    }

    function onCompletedPress() {
      resetPress();
      if (hintText) hintText.textContent = '주행 요약 준비 중...';
      if (btnIcon) {
        btnIcon.textContent = 'check';
        btnIcon.classList.add('text-primary');
      }
      if (navigator.vibrate) {
        navigator.vibrate([100, 50, 200]);
      }
      setTimeout(() => {
        if (hintText) hintText.textContent = '주행 종료 완료';
      }, 500);
    }

    function startPress(e) {
      if (e.type === 'touchstart') e.preventDefault();
      pressStartTime = Date.now();
      resetPress();
      animFrame = requestAnimationFrame(updateProgress);
    }

    function cancelPress() {
      resetPress();
    }

    if (btn) {
      btn.addEventListener('mousedown', startPress);
      btn.addEventListener('mouseup', cancelPress);
      btn.addEventListener('mouseleave', cancelPress);

      btn.addEventListener('touchstart', startPress, { passive: false });
      btn.addEventListener('touchend', cancelPress);
      btn.addEventListener('touchcancel', cancelPress);
    }
  })();
</script></main></body></html>
